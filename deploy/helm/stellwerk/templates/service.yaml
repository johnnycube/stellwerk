apiVersion: v1
kind: Service
metadata:
  name: {{ include "stellwerk.fullname" . }}
  labels: {{- include "stellwerk.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "stellwerk.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    {{- if .Values.metrics.enabled }}
    - { name: metrics, port: 9090, targetPort: metrics }
    {{- end }}
---
# Stable DNS names per pod, for the HA peers.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stellwerk.fullname" . }}-peers
  labels: {{- include "stellwerk.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "stellwerk.selector" . | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
