{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stellwerk.fullname" . }}
  labels: {{- include "stellwerk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k | replace "*" "_any" }}: {{ $v | quote }}
  {{- end }}
  {{- if and (gt (int .Values.ha.replicas) 1) .Values.ha.secret }}
  ha.secret: {{ .Values.ha.secret | quote }}
  {{- end }}
{{- end }}
