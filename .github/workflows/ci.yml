# Checks beyond `make check`: fuzzing and the Helm chart.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fuzz decoders and parsers, 30 s each
        run: |
          for f in FuzzAlertmanager FuzzGeneric FuzzCloudEvents FuzzNtfy FuzzGotify; do
            go test -tags goolm -run '^$' -fuzz "^$f\$" -fuzztime 30s ./internal/adapters/in/source/
          done
          for f in FuzzParseMatchers FuzzParseDuration FuzzLookup; do
            go test -tags goolm -run '^$' -fuzz "^$f\$" -fuzztime 30s ./internal/core/domain/
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: fuzz-crashers, path: "**/testdata/fuzz/**" }

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: helm lint deploy/helm/stellwerk
      - name: kubeconform, pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSfLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
      - name: Render and validate against the Kubernetes schemas
        run: |
          helm template t deploy/helm/stellwerk | ./kubeconform -strict -summary
          helm template t deploy/helm/stellwerk --set ha.replicas=3 --set ha.secret=ci --set serviceMonitor.enabled=true | ./kubeconform -strict -summary -ignore-missing-schemas
          ./kubeconform -strict -summary deploy/kubernetes/stellwerk.yaml
