name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write   # keyless signing with cosign
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go vet -tags goolm ./...
      - run: go test -tags goolm -race ./...
      - run: go test -tags "goolm noha" ./...

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Build (CGO for SQLite, so natively per architecture)
        run: |
          name="stellwerk_${GITHUB_REF_NAME#v}_linux_${{ matrix.arch }}"
          mkdir -p "dist/$name"
          CGO_ENABLED=1 go build -tags goolm -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/stellwerk" ./cmd/stellwerk
          cp LICENSE NOTICE README.md CHANGELOG.md stellwerk.example.yaml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/stellwerk_linux_${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true                # SBOM attestation in the registry
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the image (keyless, tied to this workflow)
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.push.outputs.digest }}"

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push the chart to ghcr.io (OCI)
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/stellwerk --version "$v" --app-version "$GITHUB_REF_NAME" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/stellwerk-$v.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
      - uses: actions/upload-artifact@v7
        with: { name: chart, path: dist/*.tgz }

  release:
    needs: [binaries, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Checksums, signed
        run: |
          cd dist
          sha256sum *.tar.gz *.tgz > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: GitHub release with the changelog section
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF2

          **Image:** \`ghcr.io/${GITHUB_REPOSITORY}:${v}\`, signed with cosign:
          \`cosign verify ghcr.io/${GITHUB_REPOSITORY}:${v} --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`

          **Helm:** \`helm install stellwerk oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/stellwerk --version ${v}\`
          EOF2
          pre=""; case "$v" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $pre dist/*
